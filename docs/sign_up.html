<!DOCTYPE hmtl>
<html>
    <head>
        <meta charset="utf-08">
        <meta name="viewport" content="width-device-width, initial-scale=1.0">
        <title>SerenIQ</title>
        <link rel="icon" type="img/png" href="sereniq_logo-removebg-preview.png">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="sign_up.css">
    </head>

    <body>
        <header class="head-section">
            <div class="logo-title-container">
                <div class="logo-container">
                    <a href="index.html"><img src="sereniq_logo-removebg-preview.png" alt="sereniq_logo"></a>
                </div>
                <div class="title-section">
                    <a href="index.html"><h1>SerenIQ</h1></a>
                </div>
            </div>
        </header>

        <section class="sign-up-content">
            <h1>Sign Up To Explore SerenIQ</h1>
                <form action="#" method="post" class="sign-up-form">
                    <div class="input-group">
                        <label for="user-first-name">First Name</label>
                        <input type="text" id="user-first-name" placeholder="Enter Your First Name">
                    </div>

                    <div class="input-group">
                        <label for="user-last-name">Last Name</label>
                        <input type="text" id="user-last-name" placeholder="Enter Your Last Name">
                    </div>

                    <div class="input-group">
                        <label for="user-email">Email-Address</label>
                        <input type="email" id="user-email" placeholder="Enter Your Email Address">
                    </div>

                    <div class="input-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="Create your Unique Password">
                    </div>

                    <div class="input-group">
                        <label for="user-address">Address</label>
                        <input type="text" id="user-address" placeholder="Enter Your Address">
                    </div>

                    <div class="input-group">
                        <label for="user-country">Country</label>
                        <input type="text" id="user-country" placeholder="Enter Your Country Name">
                    </div>

                    <div class="input-group">
                        <label for="user-state">State</label>
                        <input type="text" id="user-state" placeholder="Enter Your Current State">
                    </div>

                    <div class="input-group">
                        <label for="user-city">City</label>
                        <input type="text" id="user-city" placeholder="Enter Your City Name">
                    </div>

                    <div class="input-group">
                        <label for="user-pincode">Pincode</label>
                        <input type="text" id="user-pincode" placeholder="Enter Your Pincode">
                    </div>


                    <button type="submit" class="sign-up-button">Sign UP</button>

                    <div class="divider">
                        <span>Or</span>
                    </div>

                    <div class="social-login">
                        <button type="button" class="google-btn" aria-label="Sign up with Google">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="24px" height="24px">
                                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                                <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                                <path fill="none" d="M0 0h48v48H0z"/>
                            </svg>

                        Sign Up With Google</button>
                    </div>
                </form>
        </section>
        <script src="script.js"></script>
    </body>
</html>
