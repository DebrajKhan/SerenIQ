<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-08">
        <meta name="viewport" content="width-device-width, initial-scale=1.0">
        <title>SerenIQ</title>
        <link rel="icon" href="sereniq_logo-removebg-preview.png">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="sereniq_main1.css">
    </head>
    <body>
        <header class="dashboard-header">
            <div class="dashboard-header-div1">
                <h1>Welcome, User</h1>
            </div>
        </header>
        
        <main>
            <section class="friend-list">
                    <p>check out who is online below</p>
                    <div class="friend-container">
                        <p>user's friend_no1</p>
                        <span class="online-dot"></span>
                    </div>
            </section>

            <section class="video-rooms">
                <p>See below for available rooms to share your story</p>
                <div class="video-rooms-header-row">
                    <p>ROOM Name</p>
                    <p>Room Created By</p>
                    <p>Room Created From</p>
                    <p>Room Created For</p>
                    <p>Room Size</p>
                    <p>Room Time</p>
                </div>

                <div class="video-rooms-list">
                    <div class="video-rooms-subcontainer">
                        <p>User's room</p>
                        <p>User's name</p>
                        <p>User's location</p>
                        <p>User's purpose</p>
                        <p>5 people</p>
                        <span class="live-clock">00:00:00</span>
                    </div>
                </div>
            </section>


        </main>
        <script src="script.js"></script>
    </body>
</html>
